databaseChangeLog:
  - changeSet:
      id: 2
      author: core
      changes:
        - createTable:
            tableName: chats
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false

  - changeSet:
      id: 3
      author: core
      changes:
        - createIndex:
            indexName: idx_chats_owner_id_created_at_id
            tableName: chats
            columns:
              - column:
                  name: owner_id
              - column:
                  name: created_at
                  descending: true
              - column:
                  name: id
                  descending: true

  - changeSet:
      id: 4
      author: core
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_messages_chat_id
                    references: chats(id)
                    deleteCascade: true
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: edited
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: deleted_at
                  type: timestamptz
                  constraints:
                    nullable: true

  - changeSet:
      id: 5
      author: core
      changes:
        - createIndex:
            indexName: idx_messages_chat_id_created_at_id
            tableName: messages
            columns:
              - column:
                  name: chat_id
              - column:
                  name: created_at
              - column:
                  name: id
  - changeSet:
      id: 6
      author: core
      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
  - changeSet:
      id: 7
      author: core
      changes:
        - addColumn:
            tableName: messages
            columns:
              - column:
                  name: role
                  type: varchar(16)
                  defaultValue: USER
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE messages ADD CONSTRAINT chk_messages_role CHECK (role IN ('USER', 'AGENT'))