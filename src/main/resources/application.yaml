server:
  port: 8082
spring:
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: dacs-core-agent-responses
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 5
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3:8b}
        think: false
  application:
    name: core
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core}
    username: ${DB_USERNAME:core}
    password: ${DB_PASSWORD:core_pass}
  # Liquibase не умеет работать через R2DBC, поэтому миграции идут по отдельному JDBC-подключению
  liquibase:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core}
    user: ${DB_USERNAME:core}
    password: ${DB_PASSWORD:core_pass}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SCHEME}://keycloak:${KEYCLOAK_PORT}/realms/DACS
logging:
  level:
    # аналог show-sql из JPA: выводит SQL-запросы R2DBC в лог
    org.springframework.r2dbc.core: DEBUG

app:
  chat:
    context-tokens: ${OLLAMA_CONTEXT_TOKENS:8192}
    output-tokens: ${OLLAMA_MAX_OUTPUT_TOKENS:1024}
  kafka:
    topic: DACS_agent_request
    response-topic: DACS_agent_response
  pagination:
    chat-page-size: 20
    message-page-size: 30
    source-page-size: 20
    impl-page-size: 20


  aging:
    recent-days: 30
    cooling-days: 90
    unused-days: 180
    audit-lag-days: 1
    recent-usage: 0.1
    cooling-usage: 0.7
    unused-usage: 1.0
    old-years: 3
    small-bytes: 32
    duplicate-weight: 0.35
    name-weight: 0.15
    folder-weight: 0.15
    owner-weight: 0.20
    old-weight: 0.10
    small-weight: 0.05
    cooling-score: 30
    obsolete-score: 60
    name-markers: [copy, копия, old, archive, temp, tmp, final_v2, черновик]
    folder-markers: [archive, old, backup, "2020", "2021"]
